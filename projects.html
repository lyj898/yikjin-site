<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Projects — YikJin</title>
<meta name="description" content="Yik Jin — a collection of web projects.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital@1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #171613;
    --ink-soft: #57544c;
    --paper: #ffffff;
    --hairline: #E9E7E0;
    --gold: #9C8355;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 2rem clamp(1.5rem, 6vw, 4rem);
  }

  .logo{
    font-family: 'Parisienne', cursive;
    font-size: 1.9rem;
    color: var(--ink);
    text-decoration: none;
  }

  nav a{
    color: var(--ink-soft);
    text-decoration:none;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 500;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  nav a:hover{
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  main{
    flex: 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap: 0.75rem;
    padding: 3rem 2rem;
  }

  main h1{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--ink);
  }

  main p{
    font-size: 0.85rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  footer{
    display:flex;
    justify-content:center;
    padding: 2rem;
  }

  footer p{
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: #a8a49a;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">YikJin</a>
    <nav aria-label="Primary">
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main>
    <h1>Projects</h1>
    <p>A collection of web work — coming soon.</p>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Yik Jin</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
